name: CI

on:
  pull_request:
    branches: [ master, Ashraful ]
  push:
    branches:
      - master
      - Ashraful
      - codex/phase-0-security-foundation
      - 'automation/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Core contracts
        run: python3 scripts/check_core_contracts.py

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EduOS.slnx

      # Independent release gates remain visible even while legacy Service/App contracts
      # are being migrated. The whole-solution build must still pass for release.
      - name: Build canonical Core
        run: dotnet build EduOS.Core/EduOS.Core.csproj --configuration Release --no-restore

      - name: Build Persistence
        run: dotnet build EduOS.Persistence/EduOS.Persistence.csproj --configuration Release --no-restore

      - name: Build
        run: dotnet build EduOS.slnx --configuration Release --no-restore

      - name: Test public admission regression
        run: dotnet test EduOS.Tests/EduOS.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~PublicAdmissionServiceTests" --logger "console;verbosity=normal"

      - name: Validate EF model snapshot
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes --project EduOS.Persistence --startup-project EduOS.App --context EduOSDbContext --configuration Release --no-build

      - name: Test
        run: dotnet test EduOS.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Validate application publish
        run: dotnet publish EduOS.App/EduOS.App.csproj --configuration Release --no-build --output /tmp/eduos-publish
