name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master, codex/phase-0-security-foundation ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EduOS.slnx

      - name: Build
        run: dotnet build EduOS.slnx --configuration Release --no-restore

      - name: Generate EF snapshot probe
        if: github.ref == 'refs/heads/codex/phase-0-security-foundation' || github.head_ref == 'codex/phase-0-security-foundation'
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations add SnapshotSyncProbe --project EduOS.Persistence --startup-project EduOS.App --context EduOSDbContext --no-build --output-dir Migrations/SnapshotSyncProbe

      - name: Upload EF snapshot probe
        if: always() && (github.ref == 'refs/heads/codex/phase-0-security-foundation' || github.head_ref == 'codex/phase-0-security-foundation')
        uses: actions/upload-artifact@v4
        with:
          name: ef-snapshot-probe
          path: |
            EduOS.Persistence/Migrations/EduOSDbContextModelSnapshot.cs
            EduOS.Persistence/Migrations/SnapshotSyncProbe
          if-no-files-found: warn
          retention-days: 1

      - name: Test
        run: dotnet test EduOS.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
