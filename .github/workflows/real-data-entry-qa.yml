name: Real Data Entry QA - Disposable Browser and SQL

on:
  workflow_dispatch:
  push:
    branches: [Ashraful]
    paths:
      - '.github/workflows/real-data-entry-qa.yml'
      - '.devcontainer/qa.sh'
      - 'EduOS.Tests/JavaScript/codespaces-qa-parity.test.cjs'
      - 'scripts/qa/compare-real-route-coverage.cjs'
      - 'scripts/qa/page-action-coverage.cjs'
      - 'tests/browser/page-action-probe.cjs'
      - 'tests/browser/real-export-report-qa.cjs'
      - 'scripts/qa/release-readiness.cjs'
      - 'tests/browser/real-privileged-route-coverage.cjs'
      - 'EduOS.Tests/JavaScript/real-route-coverage-reconcile.test.cjs'
      - 'EduOS.Tests/JavaScript/release-privileged-coverage.test.cjs'
      - 'tests/browser/real-data-entry.cjs'
      - 'tests/browser/real-academic-foundation.cjs'
      - 'tests/browser/real-student-enrollment.cjs'
      - 'EduOS.Tests/App/SqlServerRealStudentEnrollmentEvidenceTests.cs'
      - 'tests/browser/real-menu-route-sweep.cjs'
      - 'tests/browser/real-tenantadmin-page-render.cjs'
      - 'tests/browser/real-roleexclusive-page-render.cjs'
      - 'EduOS.Tests/App/SqlServerRealAcademicFoundationEvidenceTests.cs'
      - 'EduOS.Tests/App/SqlServerRealDataEntryEvidenceTests.cs'
      - 'EduOS.App/**'
      - 'EduOS.Persistence/**'
      - 'EduOS.Service/**'
      - 'EduOS.Core/**'

permissions:
  contents: read

concurrency:
  group: eduos-real-data-entry-ashraful
  # Never spend runner hours validating superseded release candidates.
  # Latest exact-SHA failure diagnosis and page coverage take priority.
  cancel-in-progress: true

jobs:
  real-data-entry:
    if: github.ref == 'refs/heads/Ashraful'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      QA_URL: https://qa.eduos.test:7243
      QA_DB: EduOS_Demo_AutoQa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact branch SHA and isolated target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/Ashraful"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$QA_URL" = "https://qa.eduos.test:7243"
          test "$QA_DB" = "EduOS_Demo_AutoQa"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Codespaces and Actions share real browser and SQL QA gates
        run: |
          bash -n .devcontainer/qa.sh
          node --test EduOS.Tests/JavaScript/codespaces-qa-parity.test.cjs
          node --test EduOS.Tests/JavaScript/release-privileged-coverage.test.cjs
      - name: Restore and build actual EduOS app and SQL verifier
        run: |
          dotnet restore EduOS.slnx
          dotnet build EduOS.slnx -c Release --no-restore
          dotnet tool install --global dotnet-ef --version 10.0.14
      - name: Start private disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          sqlpass="Qa_$(openssl rand -hex 20)_aA9!"
          echo "::add-mask::$sqlpass"
          echo "QA_SQL_PASSWORD=$sqlpass" >> "$GITHUB_ENV"
          docker run --rm -d --name eduos-real-qa-sql \
            -p 127.0.0.1:14333:1433 -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$sqlpass" mcr.microsoft.com/mssql/server:2022-latest
          for n in $(seq 1 90); do
            if docker logs eduos-real-qa-sql 2>&1 | grep -q 'SQL Server is now ready for client connections'; then exit 0; fi
            test "$(docker inspect -f '{{.State.Running}}' eduos-real-qa-sql)" = "true"
            sleep 2
          done
          echo "SQL startup timeout" >&2
          exit 1
      - name: Apply EF migrations to isolated demo database
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__DefaultConnection="Server=127.0.0.1,14333;Database=$QA_DB;User Id=sa;Password=$QA_SQL_PASSWORD;Encrypt=True;TrustServerCertificate=True;Connect Timeout=30"
          export DatabaseInitialization__Enabled=false
          export DatabaseInitialization__ApplyMigrations=false
          dotnet ef database update --project EduOS.Persistence --startup-project EduOS.App \
            --context EduOSDbContext --configuration Release --no-build
      - name: Generate local HTTPS cert and ephemeral synthetic secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "127.0.0.1 qa.eduos.test" | sudo tee -a /etc/hosts > /dev/null
          demo="Qa_$(openssl rand -hex 20)_aA9!"
          platform="Qa_Plat_$(openssl rand -hex 30)_aA9!"
          jwt="$(openssl rand -hex 40)"
          cert="$(openssl rand -hex 22)"
          for secret in "$demo" "$platform" "$jwt" "$cert"; do echo "::add-mask::$secret"; done
          {
            echo "QA_DEMO_PASSWORD=$demo"
            echo "QA_PLATFORM_PASSWORD=$platform"
            echo "QA_JWT_SECRET=$jwt"
            echo "QA_CERT_PASSWORD=$cert"
            echo "QA_YEAR_NAME=QA Academic Year $GITHUB_RUN_ID"
            echo "QA_TERM_NAME=QA First Term $GITHUB_RUN_ID"
            echo "QA_PROGRAM_NAME=QA Programme $GITHUB_RUN_ID"
            echo "QA_LEVEL_NAME=QA Class One $GITHUB_RUN_ID"
            echo "QA_SUBJECT_NAME=QA Subject $GITHUB_RUN_ID"
            echo "QA_SECTION_NAME=QA Section A $GITHUB_RUN_ID"
            echo "QA_CURRICULUM_NAME=QA Curriculum $GITHUB_RUN_ID"
            echo "QA_BATCH_NAME=QA Batch $GITHUB_RUN_ID"
            echo "QA_STUDENT_NAME=QA Student $GITHUB_RUN_ID"
            echo "QA_GUARDIAN_NAME=QA Guardian $GITHUB_RUN_ID"
            echo "QA_STUDENT_ROLL=QA-Roll-$GITHUB_RUN_ID"
            echo "NO_PROXY=qa.eduos.test,127.0.0.1,localhost"
            echo "no_proxy=qa.eduos.test,127.0.0.1,localhost"
          } >> "$GITHUB_ENV"
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$RUNNER_TEMP/eduos-qa.key" -out "$RUNNER_TEMP/eduos-qa.crt" \
            -days 1 -subj "/CN=qa.eduos.test" -addext "subjectAltName=DNS:qa.eduos.test" \
            > /dev/null 2>&1
          openssl pkcs12 -export -out "$RUNNER_TEMP/eduos-qa.pfx" \
            -inkey "$RUNNER_TEMP/eduos-qa.key" -in "$RUNNER_TEMP/eduos-qa.crt" -passout "pass:$cert"
          mkdir -p "$RUNNER_TEMP/qa-keys" "$RUNNER_TEMP/qa-private"
          chmod 700 "$RUNNER_TEMP/qa-keys" "$RUNNER_TEMP/qa-private"
      - name: Launch real EduOS app using Staging-only demo identity
        id: app_start
        shell: bash
        run: |
          set -euo pipefail
          export ASPNETCORE_ENVIRONMENT=Staging
          export ASPNETCORE_URLS="https://0.0.0.0:7243"
          export ASPNETCORE_Kestrel__Certificates__Default__Path="$RUNNER_TEMP/eduos-qa.pfx"
          export ASPNETCORE_Kestrel__Certificates__Default__Password="$QA_CERT_PASSWORD"
          export ConnectionStrings__DefaultConnection="Server=127.0.0.1,14333;Database=$QA_DB;User Id=sa;Password=$QA_SQL_PASSWORD;Encrypt=True;TrustServerCertificate=True;Connect Timeout=30"
          export AllowedHosts=qa.eduos.test
          export Cors__AllowedOrigins__0="$QA_URL"
          export Cors__AllowedOrigins__1="$QA_URL"
          export DataProtection__KeysPath="$RUNNER_TEMP/qa-keys"
          export FileStorage__PrivateBasePath="$RUNNER_TEMP/qa-private"
          export DatabaseInitialization__Enabled=false
          export DatabaseInitialization__ApplyMigrations=false
          export DemoData__Enabled=true
          export DemoData__SharedPassword="$QA_DEMO_PASSWORD"
          export DemoData__PlatformQaPassword="$QA_PLATFORM_PASSWORD"
          export JwtSettings__Secret="$QA_JWT_SECRET"
          dotnet run --project EduOS.App -c Release --no-build --no-launch-profile \
            > "$RUNNER_TEMP/eduos-realqa-app.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/eduos-realqa.pid"
          for n in $(seq 1 90); do
            if curl --noproxy '*' -kfsS "$QA_URL/health/ready" >/dev/null 2>&1; then
              echo "Real application and SQL Server ready."
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/eduos-realqa.pid")" 2>/dev/null; then
              echo "EduOS process stopped. Review protected app log in runner." >&2
              exit 1
            fi
            sleep 2
          done
          echo "EduOS application did not become ready" >&2
          exit 1
      - name: Install pinned Playwright Chromium
        id: browser_deps
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Real browser login, form POST, reload and denied role
        id: year_term
        env:
          EDUOS_QA_ORIGIN: https://qa.eduos.test:7243
        run: node tests/browser/real-data-entry.cjs
      - name: Create programme, class, subject and independent section through real browser
        id: academic_foundation
        if: ${{ always() && steps.app_start.outcome == 'success' && steps.browser_deps.outcome == 'success' }}
        env:
          EDUOS_QA_ORIGIN: https://qa.eduos.test:7243
        run: node tests/browser/real-academic-foundation.cjs
      - name: Real student plus guardian, batch, curriculum and offering lifecycle
        id: student_entry
        if: ${{ always() && steps.app_start.outcome == 'success' && steps.browser_deps.outcome == 'success' && steps.academic_foundation.outcome == 'success' && steps.year_term.outcome == 'success' }}
        env:
          EDUOS_QA_ORIGIN: https://qa.eduos.test:7243
        run: node tests/browser/real-student-enrollment.cjs
      - name: Verify real Student CSV, XLSX and scoped GL report reads with unauthorized denials
        id: export_report
        if: ${{ always() && steps.app_start.outcome == 'success' && steps.browser_deps.outcome == 'success' && steps.student_entry.outcome == 'success' }}
        env:
          EDUOS_QA_ORIGIN: https://qa.eduos.test:7243
        run: node tests/browser/real-export-report-qa.cjs
      - name: Sweep tenant role sidebar page links in actual app (read-only)
        id: menu_routes
        if: ${{ always() && steps.app_start.outcome == 'success' && steps.browser_deps.outcome == 'success' }}
        env:
          EDUOS_QA_ORIGIN: https://qa.eduos.test:7243
        run: node tests/browser/real-menu-route-sweep.cjs
      - name: Render all TenantAdmin sidebar pages in Chromium desktop/mobile (read-only)
        id: page_render
        if: ${{ always() && steps.app_start.outcome == 'success' && steps.browser_deps.outcome == 'success' }}
        env:
          EDUOS_QA_ORIGIN: https://qa.eduos.test:7243
        run: node tests/browser/real-tenantadmin-page-render.cjs
      - name: Render role-exclusive pages for other 12 institution roles (read-only)
        id: role_exclusive_render
        if: ${{ always() && steps.app_start.outcome == 'success' && steps.browser_deps.outcome == 'success' }}
        env:
          EDUOS_QA_ORIGIN: https://qa.eduos.test:7243
        run: node tests/browser/real-roleexclusive-page-render.cjs
      - name: Verify platform and optional-module routes with isolated privileged credentials
        id: privileged_routes
        if: ${{ always() && steps.app_start.outcome == 'success' && steps.browser_deps.outcome == 'success' && steps.role_exclusive_render.outcome == 'success' }}
        env:
          EDUOS_QA_ORIGIN: https://qa.eduos.test:7243
        run: node tests/browser/real-privileged-route-coverage.cjs
      - name: Reconcile 204 declared routes with exercised role navigation (non-certifying)
        id: route_coverage
        if: ${{ always() && steps.menu_routes.outcome == 'success' && steps.page_render.outcome == 'success' && steps.role_exclusive_render.outcome == 'success' && steps.privileged_routes.outcome == 'success' }}
        run: node scripts/qa/compare-real-route-coverage.cjs
      - name: Inventory 204 pages x 8 business actions without claiming untested CRUD
        id: action_coverage
        if: ${{ always() && steps.route_coverage.outcome == 'success' && steps.student_entry.outcome == 'success' && steps.year_term.outcome == 'success' && steps.academic_foundation.outcome == 'success' && steps.export_report.outcome == 'success' }}
        run: node scripts/qa/page-action-coverage.cjs
      - name: Independently verify committed UI entries in real SQL
        id: sql_evidence
        if: ${{ always() && steps.app_start.outcome == 'success' && steps.year_term.outcome == 'success' && steps.academic_foundation.outcome == 'success' && steps.student_entry.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export EDUOS_SQL_REAL_QA_CONNECTION="Server=127.0.0.1,14333;Database=$QA_DB;User Id=sa;Password=$QA_SQL_PASSWORD;Encrypt=True;TrustServerCertificate=True;Connect Timeout=30"
          dotnet test EduOS.Tests/EduOS.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~SqlServerRealDataEntryEvidenceTests|FullyQualifiedName~SqlServerRealAcademicFoundationEvidenceTests|FullyQualifiedName~SqlServerRealStudentEnrollmentEvidenceTests" \
            --logger "trx;LogFileName=real-data-entry.trx" --results-directory TestResults
      - name: Validate staged acceptance evidence and mark release NO_GO pending institutional gates
        id: readiness
        if: ${{ always() && steps.sql_evidence.outcome == 'success' && steps.route_coverage.outcome == 'success' && steps.privileged_routes.outcome == 'success' }}
        run: node scripts/qa/release-readiness.cjs
      - name: Record exact-SHA test gate outcomes
        if: always()
        shell: bash
        env:
          YEAR_TERM_RESULT: ${{ steps.year_term.outcome }}
          ACADEMIC_RESULT: ${{ steps.academic_foundation.outcome }}
          STUDENT_RESULT: ${{ steps.student_entry.outcome }}
          MENU_RESULT: ${{ steps.menu_routes.outcome }}
          PAGE_RESULT: ${{ steps.page_render.outcome }}
          EXCLUSIVE_RESULT: ${{ steps.role_exclusive_render.outcome }}
          COVERAGE_RESULT: ${{ steps.route_coverage.outcome }}
          ACTION_COVERAGE_RESULT: ${{ steps.action_coverage.outcome }}
          EXPORT_REPORT_RESULT: ${{ steps.export_report.outcome }}
          PRIVILEGED_RESULT: ${{ steps.privileged_routes.outcome }}
          READINESS_RESULT: ${{ steps.readiness.outcome }}
          SQL_RESULT: ${{ steps.sql_evidence.outcome }}
        run: |
          {
            echo "## EduOS real browser + SQL acceptance"
            echo ""
            echo "Commit: \`$GITHUB_SHA\` (Ashraful). Disposable SQL only."
            echo ""
            echo "| Gate | GitHub result |"
            echo "| --- | --- |"
            echo "| Year/Term real form | $YEAR_TERM_RESULT |"
            echo "| Programme/Class/Subject/Section real form | $ACADEMIC_RESULT |"
            echo "| Student/Guardian/Offering browser + UUID retry | $STUDENT_RESULT |"
            echo "| 13-role real menu route GET | $MENU_RESULT |"
            echo "| TenantAdmin all-sidebar Chromium desktop/mobile | $PAGE_RESULT |"
            echo "| Other role-exclusive Chromium pages desktop/mobile | $EXCLUSIVE_RESULT |"
            echo "| Privileged/optional routes (11+4) and negative role-access QA | $PRIVILEGED_RESULT |"
            echo "| Declared-route coverage gap inventory (navigation only) | $COVERAGE_RESULT |"
            echo "| Page-by-page CRUD/Approve/Print/Excel/PDF/Report evidence census | $ACTION_COVERAGE_RESULT |"
            echo "| Real bounded Student CSV, XLSX and GL Report/API role denials | $EXPORT_REPORT_RESULT |"
            echo "| Independent SQL persistence | $SQL_RESULT |"
            echo "| Exact-SHA release-readiness evidence (always NO_GO without UAT) | $READINESS_RESULT |"
            echo ""
            echo "A skipped or failed gate blocks production approval. No live Codespaces app was accessed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve synthetic QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-data-entry-${{ github.sha }}
          path: |
            qa-artifacts/real-data-entry.json
            qa-artifacts/real-academic-foundation.json
            qa-artifacts/real-student-enrollment.json
            qa-artifacts/real-menu-route-sweep.json
            qa-artifacts/real-tenantadmin-page-render.json
            qa-artifacts/real-roleexclusive-page-render.json
            qa-artifacts/real-privileged-route-coverage.json
            qa-artifacts/real-route-coverage-gap.json
            qa-artifacts/page-action-coverage.json
            qa-artifacts/page-action-coverage.csv
            qa-artifacts/real-export-report-qa.json
            qa-artifacts/release-readiness.json
            TestResults/real-data-entry.trx
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop app and destroy disposable SQL
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/eduos-realqa.pid"; then
            kill "$(cat "$RUNNER_TEMP/eduos-realqa.pid")" 2>/dev/null || true
          fi
          docker stop eduos-real-qa-sql 2>/dev/null || true
