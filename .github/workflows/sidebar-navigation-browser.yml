name: Sidebar Navigation Chromium UI Acceptance
on:
  push:
    branches: [Ashraful]
    paths:
      - 'EduOS.App/wwwroot/js/sidebar-navigation.js'
      - 'EduOS.App/wwwroot/js/platform/ui-shell.js'
      - 'EduOS.App/Views/Shared/_Layout.cshtml'
      - 'EduOS.App/wwwroot/css/site.css'
      - 'EduOS.Tests/JavaScript/sidebar-navigation.test.cjs'
      - 'EduOS.Tests/JavaScript/sidebar-route-inventory.test.cjs'
      - 'tests/browser/sidebar-navigation.cjs'
      - 'tests/browser/ui-shell.cjs'
      - 'EduOS.Tests/JavaScript/ui-shell.test.cjs'
      - 'tests/browser/sidebar-role-staging.cjs'
      - '.github/workflows/sidebar-navigation-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sidebar-navigation-browser-Ashraful
  cancel-in-progress: true
jobs:
  chromium-sidebar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax-check authenticated staging browser
        run: node --check tests/browser/sidebar-role-staging.cjs
      - name: Exercise scoped bilingual sidebar keyboard navigation in Chromium
        run: node tests/browser/sidebar-navigation.cjs
      - name: Exercise shared page shell, breadcrumbs, notifications and tenant isolation
        run: node tests/browser/ui-shell.cjs
