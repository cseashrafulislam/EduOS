name: Development Environment

on:
  workflow_dispatch:
  push:
    branches: [ Ashraful ]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/development-environment.yml'
      - 'docs/DEVELOPMENT_ENVIRONMENT.md'

permissions:
  contents: read

concurrency:
  group: eduos-dev-env-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Ashraful
        uses: actions/checkout@v4

      - name: Validate devcontainer and pinned EF tool setup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          cfg=json.loads(pathlib.Path('.devcontainer/devcontainer.json').read_text())
          assert 'dotnet:2.0-10.0-noble' in cfg['image']
          assert cfg['features']['ghcr.io/devcontainers/features/node:1']['version']=='22'
          assert 'ghcr.io/devcontainers/features/docker-in-docker:2' in cfg['features']
          assert 'dotnet tool install --global dotnet-ef --version 10.0.14' in pathlib.Path('.devcontainer/setup.sh').read_text()
          assert cfg['portsAttributes']['5146']['visibility'] == 'private'
          assert cfg['portsAttributes']['7243']['visibility'] == 'private'
          assert cfg['portsAttributes']['7243']['protocol'] == 'https'
          qa=pathlib.Path('.devcontainer/qa.sh').read_text()
          assert 'EduOS_Demo_Codespaces' in qa
          assert '127.0.0.1,14333' in qa
          assert 'ASPNETCORE_ENVIRONMENT=Staging' in qa
          assert 'DemoData__Enabled=true' in qa
          assert 'DataProtection__KeysPath' in qa
          assert 'FileStorage__PrivateBasePath' in qa
          assert 'AllowedHosts="$allowed_hosts"' in qa
          print('Valid .NET 10 / Node 22 / Docker + private Codespaces QA configuration')
          PY
          bash -n .devcontainer/setup.sh .devcontainer/sqlserver.sh .devcontainer/qa.sh

      - name: Provision .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Provision Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check developer toolchain
        run: |
          dotnet --version
          node --version
          docker version

      - name: Install pinned global EF CLI (preserves existing CI compatibility)
        run: dotnet tool install --global dotnet-ef --version 10.0.14

      - name: Restore whole EduOS solution
        run: dotnet restore EduOS.slnx

      - name: Build whole EduOS solution
        run: dotnet build EduOS.slnx --configuration Release --no-restore

      - name: Run shared JavaScript contract tests
        run: node --test EduOS.Tests/JavaScript/*.test.cjs

      - name: Report pinned toolchain
        run: |
          dotnet ef --version
          echo "Developer toolchain and canonical EduOS build verified at commit $GITHUB_SHA"
