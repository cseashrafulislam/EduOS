name: Finance Fee Bilingual Chromium UI Acceptance
on:
  push:
    branches: [Ashraful]
    paths:
      - 'EduOS.App/wwwroot/js/finance/fees.js'
      - 'EduOS.App/wwwroot/js/platform/task-workspace-locales.js'
      - 'EduOS.App/Views/FeeOperations/Index.cshtml'
      - 'EduOS.App/Views/FeeDocuments/Document.cshtml'
      - 'EduOS.App/wwwroot/js/finance/fee-documents.js'
      - 'EduOS.App/wwwroot/js/platform/page-context-help.js'
      - 'EduOS.Tests/JavaScript/task-focused-operations-library-learning.test.cjs'
      - 'EduOS.Tests/JavaScript/fee-documents.test.cjs'
      - 'EduOS.Tests/JavaScript/page-context-help.test.cjs'
      - 'EduOS.Tests/JavaScript/fee-bilingual-dynamic.test.cjs'
      - 'EduOS.Tests/JavaScript/fee-navigation-workspaces.test.cjs'
      - 'tests/browser/fee-bilingual.cjs'
      - 'tests/browser/fee-document-bilingual.cjs'
      - 'tests/browser/fee-ledger-isolation.cjs'
      - 'tests/browser/fee-due-calendar.cjs'
      - 'EduOS.App/wwwroot/js/finance/fee-receivables-aging.js'
      - 'EduOS.App/wwwroot/js/finance/fee-reconciliation.js'
      - 'EduOS.App/wwwroot/js/finance/fee-payment-reconciliation.js'
      - 'EduOS.App/Views/FeeReceivablesAging/Index.cshtml'
      - 'EduOS.Tests/JavaScript/fee-aging-isolation.test.cjs'
      - 'tests/browser/fee-aging-isolation.cjs'
      - 'EduOS.App/Views/FeeInvoiceCoverage/Index.cshtml'
      - 'EduOS.App/Views/FeeInstallmentProjection/Index.cshtml'
      - 'EduOS.App/wwwroot/js/finance/fee-discount-attribution-review.js'
      - 'EduOS.App/Views/FeeDiscountAttributionReview/Index.cshtml'
      - 'EduOS.Tests/JavaScript/fee-discount-attribution-review.test.cjs'
      - 'tests/browser/fee-discount-attribution.cjs'
      - 'EduOS.App/wwwroot/js/finance/discount-rules.js'
      - 'EduOS.App/Views/FeeDiscountRules/Index.cshtml'
      - 'EduOS.Tests/JavaScript/fee-discount-rules-ui.test.cjs'
      - 'tests/browser/fee-discount-rules.cjs'
      - 'EduOS.App/wwwroot/js/finance/fee-invoice-coverage.js'
      - 'EduOS.App/wwwroot/js/finance/fee-installment-projection.js'
      - 'EduOS.Tests/JavaScript/fee-coverage-projection-ui.test.cjs'
      - 'tests/browser/fee-coverage-projection.cjs'
      - 'EduOS.App/wwwroot/js/finance/fee-due-calendar.js'
      - 'EduOS.App/Views/FeeDueCalendar/Index.cshtml'
      - 'EduOS.Tests/JavaScript/fee-due-calendar-contract.test.cjs'
      - 'EduOS.Tests/JavaScript/fee-ledger-race.test.cjs'
      - '.github/workflows/fee-bilingual-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fee-bilingual-browser-Ashraful
  cancel-in-progress: true
jobs:
  chromium-finance-fees:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify localized fee preflight and formula-safe CSV in real Chromium
        run: |
          node tests/browser/fee-bilingual.cjs
          node tests/browser/fee-document-bilingual.cjs
          node tests/browser/fee-ledger-isolation.cjs
          node tests/browser/fee-due-calendar.cjs
          node tests/browser/fee-aging-isolation.cjs
          node tests/browser/fee-coverage-projection.cjs
          node tests/browser/fee-discount-attribution.cjs
          node tests/browser/fee-discount-rules.cjs
