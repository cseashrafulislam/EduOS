name: Academic Browser Smoke
on:
  push:
    branches: [Ashraful]
    paths:
      - 'EduOS.App/Views/AcademicManagement/**'
      - 'EduOS.App/wwwroot/js/academic/management*.js'
      - 'EduOS.App/Controllers/AcademicManagementController.cs'
      - 'EduOS.App/Views/Attendance/**'
      - 'EduOS.App/Views/StudentLeaves/**'
      - 'EduOS.App/Views/MyStudentLeaves/**'
      - 'EduOS.App/wwwroot/js/student-portal/leaves.js'
      - 'EduOS.App/Views/AcademicRoutines/**'
      - 'EduOS.App/Views/AcademicInstruction/**'
      - 'EduOS.App/wwwroot/js/academic/instruction.js'
      - 'EduOS.App/wwwroot/js/assessment/transcripts.js'
      - 'EduOS.App/Views/AssessmentAdministration/Transcripts.cshtml'
      - 'EduOS.App/Views/AssessmentAdministration/TranscriptDocument.cshtml'
      - 'EduOS.App/Views/AssessmentAdministration/CertificateDocument.cshtml'
      - 'EduOS.App/Views/AssessmentAdministration/Attempts.cshtml'
      - 'EduOS.App/wwwroot/js/assessment/attempts.js'
      - 'EduOS.App/wwwroot/js/assessment/certificates.js'
      - 'EduOS.App/Views/AssessmentAdministration/Setup.cshtml'
      - 'EduOS.App/wwwroot/js/assessment/setup.js'
      - 'EduOS.App/wwwroot/js/attendance/**'
      - 'EduOS.App/wwwroot/js/academic/routines.js'
      - 'tests/browser/**'
      - '.github/workflows/academic-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academic-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-academic-management:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise academic management browser UI
        run: node tests/browser/academic-management.cjs
      - name: Exercise authenticated transcript issue and revocation UI
        run: node tests/browser/assessment-transcript.cjs
      - name: Verify certificate print link excludes legacy and revoked records
        run: node tests/browser/assessment-certificate.cjs
      - name: Exercise student-specific retake and improvement approval UI
        run: node tests/browser/assessment-attempts.cjs
      - name: Exercise exam setup and subject assignment browser UI
        run: node tests/browser/assessment-setup.cjs
      - name: Exercise student enrollment and retry browser UI
        run: node tests/browser/student-enrollment.cjs
      - name: Exercise student lifecycle and transfer certificate browser UI
        run: node tests/browser/student-lifecycle.cjs
      - name: Exercise attendance, timetable and leave browser workflows
        run: node tests/browser/academic-operations.cjs
      - name: Exercise substitution scheduling, retry, cancellation and export browser workflow
        run: node tests/browser/academic-instruction.cjs
      - name: Exercise student and guardian leave self-service
        run: node tests/browser/my-student-leaves.cjs
      - name: Verify LMS authoring and quiz contracts
        run: node --test tests/browser/lms-contract.cjs tests/browser/lms-quiz-contract.cjs
