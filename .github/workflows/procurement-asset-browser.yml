name: Procurement and Asset Finance Chromium UI Acceptance
on:
  push:
    branches: [Ashraful]
    paths:
      - 'EduOS.App/wwwroot/js/procurement/supplier-settlement-instructions.js'
      - 'EduOS.App/wwwroot/js/inventory/asset-accounting.js'
      - 'EduOS.App/Views/ProcurementSupplierInvoiceMatching/Index.cshtml'
      - 'EduOS.App/Views/AssetAccounting/Index.cshtml'
      - 'EduOS.Tests/JavaScript/asset-accounting-stale-read.test.cjs'
      - 'EduOS.Tests/JavaScript/supplier-settlement-async-selection.test.cjs'
      - 'tests/browser/procurement-asset-finance.cjs'
      - '.github/workflows/procurement-asset-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: procurement-asset-browser-Ashraful
  cancel-in-progress: true
jobs:
  chromium-procurement-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify real supplier and asset scripts in Chromium
        run: node tests/browser/procurement-asset-finance.cjs
