name: Shared Page Help Chromium UI Acceptance
on:
  push:
    branches: [Ashraful]
    paths:
      - 'EduOS.App/wwwroot/js/platform/page-context-help.js'
      - 'EduOS.Tests/JavaScript/task-focused-operations-library-learning.test.cjs'
      - 'EduOS.App/Views/Shared/_Layout.cshtml'
      - 'tests/browser/page-context-help.cjs'
      - '.github/workflows/page-help-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: page-help-browser-Ashraful
  cancel-in-progress: true
jobs:
  chromium-page-help:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise shared bilingual page manuals and session isolation in Chromium
        run: node tests/browser/page-context-help.cjs
