name: Offline Study Browser Security
on:
  push:
    branches: [Ashraful]
    paths:
      - 'EduOS.App/wwwroot/js/learning/offline-library.js'
      - 'EduOS.App/wwwroot/service-worker.js'
      - 'tests/browser/offline-study-security.cjs'
      - '.github/workflows/offline-study-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-study-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-offline-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise encrypted offline reader revocation and session clear
        run: node tests/browser/offline-study-security.cjs
