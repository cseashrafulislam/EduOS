name: Sidebar Authenticated Staging Role Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-sidebar:
    if: github.ref == 'refs/heads/Ashraful'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact Ashraful SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_REF" = "refs/heads/Ashraful"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fail-closed staging guard contracts
        run: node --test EduOS.Tests/JavaScript/sidebar-staging-guards.test.cjs
      - name: Install pinned Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Read-only synthetic role and tenant acceptance
        env:
          EDUOS_BASE_URL: ${{ vars.EDUOS_BASE_URL }}
          EDUOS_E2E_STAGING_HOST: ${{ vars.EDUOS_E2E_STAGING_HOST }}
          EDUOS_E2E_ADMIN_USER: ${{ secrets.EDUOS_E2E_ADMIN_USER }}
          EDUOS_E2E_ADMIN_PASSWORD: ${{ secrets.EDUOS_E2E_ADMIN_PASSWORD }}
          EDUOS_E2E_ADMIN_TENANT_ID: ${{ vars.EDUOS_E2E_ADMIN_TENANT_ID }}
          EDUOS_E2E_ACCOUNTANT_USER: ${{ secrets.EDUOS_E2E_ACCOUNTANT_USER }}
          EDUOS_E2E_ACCOUNTANT_PASSWORD: ${{ secrets.EDUOS_E2E_ACCOUNTANT_PASSWORD }}
          EDUOS_E2E_ACCOUNTANT_TENANT_ID: ${{ vars.EDUOS_E2E_ACCOUNTANT_TENANT_ID }}
          EDUOS_E2E_VIEWER_USER: ${{ secrets.EDUOS_E2E_VIEWER_USER }}
          EDUOS_E2E_VIEWER_PASSWORD: ${{ secrets.EDUOS_E2E_VIEWER_PASSWORD }}
          EDUOS_E2E_VIEWER_TENANT_ID: ${{ vars.EDUOS_E2E_VIEWER_TENANT_ID }}
        run: node tests/browser/sidebar-role-staging.cjs
