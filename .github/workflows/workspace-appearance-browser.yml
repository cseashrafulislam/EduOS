name: Workspace Appearance Chromium UI Acceptance
on:
  push:
    branches: [Ashraful]
    paths:
      - 'EduOS.App/wwwroot/js/platform/workspace-preferences.js'
      - 'EduOS.App/wwwroot/js/site.js'
      - 'EduOS.App/Views/WorkspacePreferences/Index.cshtml'
      - 'tests/browser/workspace-appearance.cjs'
      - 'tests/browser/workspace-appearance-live.cjs'
      - 'tests/browser/workspace-appearance-live-contract.cjs'
      - 'EduOS.App/Views/Account/Login.cshtml'
      - 'EduOS.App/Resources/Localization/SharedResource.resx'
      - 'EduOS.App/Resources/Localization/SharedResource.bn-BD.resx'
      - 'EduOS.App/wwwroot/js/platform/page-context-help.js'
      - 'tests/browser/login-bilingual.cjs'
      - 'EduOS.App/wwwroot/js/account/login.js'
      - 'EduOS.App/Controllers/AccountController.cs'
      - 'EduOS.App/Controllers/LocalizationController.cs'
      - 'EduOS.App/Views/Account/BrandingSetup.cshtml'
      - '.github/workflows/workspace-appearance-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-appearance-browser-Ashraful
  cancel-in-progress: true
jobs:
  chromium-appearance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check authenticated staging script syntax and fail-closed configuration
        run: |
          node --check tests/browser/workspace-appearance-live.cjs
          node tests/browser/workspace-appearance-live-contract.cjs
          set +e
          env -u EDUOS_BASE_URL -u EDUOS_E2E_STAGING_HOST node tests/browser/workspace-appearance-live.cjs
          result=$?
          set -e
          test "$result" -eq 2
      - name: Exercise real appearance editor with isolated synthetic session/API in Chromium
        run: node tests/browser/workspace-appearance.cjs
      - name: Exercise bilingual Login, institution selection and public Help Drawer in Chromium
        run: node tests/browser/login-bilingual.cjs
