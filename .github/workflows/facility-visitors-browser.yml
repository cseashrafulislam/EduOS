name: Facility Visitors Chromium UI Acceptance
on:
  push:
    branches: [Ashraful]
    paths:
      - 'EduOS.App/Views/FacilityVisitors/Index.cshtml'
      - 'EduOS.App/wwwroot/js/facilities/visitors.js'
      - 'tests/browser/facility-visitors.cjs'
      - '.github/workflows/facility-visitors-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facility-visitors-browser-Ashraful
  cancel-in-progress: true
jobs:
  chromium-facility-visitors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise bilingual mobile and independent-host UX in real Chromium
        run: node tests/browser/facility-visitors.cjs
