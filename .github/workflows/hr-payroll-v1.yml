name: HR and Payroll V1

on:
  push:
    branches: [Ashraful]
    paths:
      - '.github/workflows/hr-payroll-v1.yml'
      - 'EduOS.App/Controllers/Api/EmployeeContractsApiController.cs'
      - 'EduOS.App/Controllers/Api/PayrollPaymentPostingController.cs'
      - 'EduOS.App/Views/EmployeeContracts/**'
      - 'EduOS.App/Views/PayrollPaymentPosting/**'
      - 'EduOS.App/Views/PayrollSalaryStructures/**'
      - 'EduOS.App/Views/PayrollSalaryComponents/**'
      - 'EduOS.App/Views/PayrollOperations/**'
      - 'EduOS.App/wwwroot/js/hr/employee-contracts.js'
      - 'EduOS.App/wwwroot/js/finance/payroll-payment-posting.js'
      - 'EduOS.App/wwwroot/js/payroll/salary-structures.js'
      - 'EduOS.App/wwwroot/js/payroll/salary-components.js'
      - 'EduOS.Core/DTOs/HR/**'
      - 'EduOS.Core/DTOs/Payroll/**'
      - 'EduOS.Core/Interfaces/IServices/IEmployeeContractService.cs'
      - 'EduOS.Core/Interfaces/IServices/IPayrollPaymentPostingService.cs'
      - 'EduOS.Service/Services/HR/**'
      - 'EduOS.Tests/Services/EmployeeContractSignedPdfTests.cs'
      - 'EduOS.Tests/Services/PayrollBankReviewExportTests.cs'
      - 'EduOS.Tests/Services/PayrollStatutoryCoverageTests.cs'
      - 'EduOS.Tests/Services/PayrollStatutoryCalculationTests.cs'
      - 'EduOS.Tests/Services/PayrollJournalPostingServiceTests.cs'
      - 'EduOS.Tests/Services/PayrollPaymentPostingServiceTests.cs'
      - 'EduOS.Tests/Services/PayrollPaymentReturnTests.cs'
      - 'EduOS.Tests/Services/PayrollJournalReversalWorkflowTests.cs'
      - 'EduOS.Tests/Services/PayrollReconciliationJournalEvidenceTests.cs'
      - 'EduOS.Tests/Services/PayrollPostingHistoricalIntegrityTests.cs'
      - 'EduOS.Tests/Services/PayrollLoanRecoverySettlementTests.cs'
  pull_request:
    branches: [Ashraful]
    paths:
      - '.github/workflows/hr-payroll-v1.yml'
      - 'EduOS.App/Controllers/Api/EmployeeContractsApiController.cs'
      - 'EduOS.App/Controllers/Api/PayrollPaymentPostingController.cs'
      - 'EduOS.App/Views/EmployeeContracts/**'
      - 'EduOS.App/Views/PayrollPaymentPosting/**'
      - 'EduOS.App/Views/PayrollSalaryStructures/**'
      - 'EduOS.App/Views/PayrollSalaryComponents/**'
      - 'EduOS.App/Views/PayrollOperations/**'
      - 'EduOS.App/wwwroot/js/hr/employee-contracts.js'
      - 'EduOS.App/wwwroot/js/finance/payroll-payment-posting.js'
      - 'EduOS.App/wwwroot/js/payroll/salary-structures.js'
      - 'EduOS.App/wwwroot/js/payroll/salary-components.js'
      - 'EduOS.Core/DTOs/HR/**'
      - 'EduOS.Core/DTOs/Payroll/**'
      - 'EduOS.Core/Interfaces/IServices/IEmployeeContractService.cs'
      - 'EduOS.Core/Interfaces/IServices/IPayrollPaymentPostingService.cs'
      - 'EduOS.Service/Services/HR/**'
      - 'EduOS.Tests/Services/EmployeeContractSignedPdfTests.cs'
      - 'EduOS.Tests/Services/PayrollBankReviewExportTests.cs'
      - 'EduOS.Tests/Services/PayrollStatutoryCoverageTests.cs'
      - 'EduOS.Tests/Services/PayrollStatutoryCalculationTests.cs'
      - 'EduOS.Tests/Services/PayrollJournalPostingServiceTests.cs'
      - 'EduOS.Tests/Services/PayrollPaymentPostingServiceTests.cs'
      - 'EduOS.Tests/Services/PayrollPaymentReturnTests.cs'
      - 'EduOS.Tests/Services/PayrollJournalReversalWorkflowTests.cs'
      - 'EduOS.Tests/Services/PayrollReconciliationJournalEvidenceTests.cs'
      - 'EduOS.Tests/Services/PayrollPostingHistoricalIntegrityTests.cs'
      - 'EduOS.Tests/Services/PayrollLoanRecoverySettlementTests.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hr-payroll-build-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore canonical EduOS.Tests project
        run: dotnet restore EduOS.Tests/EduOS.Tests.csproj
      - name: Build canonical HR regression assembly
        run: dotnet build EduOS.Tests/EduOS.Tests.csproj --configuration Release --no-restore
      - name: HR/Payroll focused regressions from EduOS.Tests
        run: dotnet test EduOS.Tests/EduOS.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~EmployeeContractSignedPdfTests|FullyQualifiedName~PayrollBankReviewExportTests|FullyQualifiedName~PayrollStatutoryCoverageTests|FullyQualifiedName~PayrollStatutoryCalculationTests|FullyQualifiedName~PayrollPaymentPostingServiceTests|FullyQualifiedName~PayrollPaymentReturnTests|FullyQualifiedName~PayrollJournalReversalWorkflowTests|FullyQualifiedName~PayrollReconciliationJournalEvidenceTests|FullyQualifiedName~PayrollPostingHistoricalIntegrityTests|FullyQualifiedName~PayrollJournalPostingServiceTests|FullyQualifiedName~PayrollLoanRecoverySettlementTests"
      - name: HR/Payroll UI syntax
        run: |
          node --check EduOS.App/wwwroot/js/hr/employee-contracts.js
          node --check EduOS.App/wwwroot/js/finance/payroll-payment-posting.js
          node --check EduOS.App/wwwroot/js/payroll/salary-structures.js
          node --check EduOS.App/wwwroot/js/payroll/salary-components.js
