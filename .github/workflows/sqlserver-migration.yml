name: SQL Server Migration Smoke

on:
  workflow_dispatch:
    inputs:
      run_40k:
        description: 'Run 40K synthetic Student Import rehearsal on disposable SQL Server'
        required: false
        type: boolean
        default: false
  push:
    branches: [ Ashraful ]

permissions:
  contents: read

concurrency:
  # Parallel V1 sprints push the same branch; retain exact-commit SQL evidence.
  group: sqlserver-migration-${{ github.sha }}
  cancel-in-progress: true

jobs:
  migrate-disposable-sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/Ashraful' && inputs.run_40k) || (github.event_name == 'push' && github.ref == 'refs/heads/Ashraful' && contains(github.event.head_commit.message, '[student-import-40k]'))) && 120 || 25 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore application
        run: dotnet restore EduOS.App/EduOS.App.csproj

      - name: Build application
        run: dotnet build EduOS.App/EduOS.App.csproj --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Start isolated SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          password="Ci_$(openssl rand -hex 20)_aA9!"
          echo "::add-mask::$password"
          printf 'CI_SQL_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          docker run --rm -d --name eduos-ci-sqlserver \
            -p 127.0.0.1:14333:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest
          ready=0
          for attempt in $(seq 1 90); do
            if docker logs eduos-ci-sqlserver 2>&1 | grep -q 'SQL Server is now ready for client connections'; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' eduos-ci-sqlserver)" != "true" ]; then
              echo "SQL Server exited before becoming ready."
              docker logs --tail 50 eduos-ci-sqlserver 2>&1
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "SQL Server startup timed out."
            docker logs --tail 50 eduos-ci-sqlserver 2>&1
            exit 1
          fi

      - name: Apply complete EF migrations to fresh SQL Server database
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__DefaultConnection="Server=127.0.0.1,14333;Database=EduOS_MigrationSmoke;User Id=sa;Password=${CI_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=30"
          export DatabaseInitialization__Enabled=false
          export DatabaseInitialization__ApplyMigrations=false
          dotnet ef database update --project EduOS.Persistence --startup-project EduOS.App \
            --context EduOSDbContext --configuration Release --no-build --verbose

      - name: Verify repeat migration deployment is idempotent
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__DefaultConnection="Server=127.0.0.1,14333;Database=EduOS_MigrationSmoke;User Id=sa;Password=${CI_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=30"
          export DatabaseInitialization__Enabled=false
          export DatabaseInitialization__ApplyMigrations=false
          dotnet ef database update --project EduOS.Persistence --startup-project EduOS.App \
            --context EduOSDbContext --configuration Release --no-build

      - name: Verify real SQL Server auth tenant roles, optimistic concurrency and session revocation
        shell: bash
        env:
          EDUOS_SQL_AUTH_TEST_CONNECTION: ${{ format('Server=127.0.0.1,14333;Database=EduOS_MigrationSmoke;User Id=sa;Password={0};Encrypt=True;TrustServerCertificate=True;Connect Timeout=30', env.CI_SQL_PASSWORD) }}
        run: |
          set -euo pipefail
          dotnet restore EduOS.Tests/EduOS.Tests.csproj
          dotnet test EduOS.Tests/EduOS.Tests.csproj --configuration Release --no-restore \
            --filter "FullyQualifiedName~SqlServerAuthTenantIntegrationTests|FullyQualifiedName~AuthSecurityStampIntegrationTests|FullyQualifiedName~SqlServerMemberAccessHistoryIntegrationTests|FullyQualifiedName~SqlServerLoginActivityIntegrationTests|FullyQualifiedName~SqlServerAcademicSetupIntegrationTests|FullyQualifiedName~SqlServerEnrollmentAllocationIntegrationTests|FullyQualifiedName~SqlServerStudentImportConcurrencyIntegrationTests|FullyQualifiedName~SqlServerStudentImportCohortRehearsalTests|FullyQualifiedName~SqlServerStudentLifecycleIntegrationTests|FullyQualifiedName~SqlServerGuardianContactProfileIntegrationTests|FullyQualifiedName~SqlServerManualPaymentIntegrationTests|FullyQualifiedName~SqlServerBankReconciliationIntakeIntegrationTests|FullyQualifiedName~SqlServerStudentFeeInstallmentPlanIntegrationTests|FullyQualifiedName~SqlServerAcademicOperationsIntegrationTests|FullyQualifiedName~SqlServerAssessmentMarkReviewIntegrityIntegrationTests|FullyQualifiedName~SqlServerAssessmentMarkReviewLifecycleIntegrationTests|FullyQualifiedName~SqlServerAcademicRoutineCollisionIntegrationTests|FullyQualifiedName~SqlServerTransportIdentityIntegrationTests|FullyQualifiedName~SqlServerTransportConcurrentUniquenessTests|FullyQualifiedName~SqlServerTransportSeatCapacityIntegrationTests|FullyQualifiedName~SqlServerV2SixteenInstituteEntitlementHttpAcceptanceTests|FullyQualifiedName~TransportReservationWindowIndexTests|FullyQualifiedName~HostelOccupiedTransferLineageContractTests|FullyQualifiedName~AssetAccountingPersistenceContractTests" \
            --logger "trx;LogFileName=sql-auth-tests.trx" --results-directory TestResults

      # One-shot push marker permits a verified, exact-commit rehearsal when workflow
      # dispatch is unavailable; ordinary parallel pushes retain the short smoke.
      - name: Rehearse 40K synthetic Student Import with restart and tenant isolation
        if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/Ashraful' && inputs.run_40k) || (github.event_name == 'push' && github.ref == 'refs/heads/Ashraful' && contains(github.event.head_commit.message, '[student-import-40k]')) }}
        shell: bash
        env:
          EDUOS_SQL_AUTH_TEST_CONNECTION: ${{ format('Server=127.0.0.1,14333;Database=EduOS_MigrationSmoke;User Id=sa;Password={0};Encrypt=True;TrustServerCertificate=True;Connect Timeout=30', env.CI_SQL_PASSWORD) }}
          EDUOS_SQL_IMPORT_40K_REHEARSAL: '1'
        run: |
          set -euo pipefail
          dotnet test EduOS.Tests/EduOS.Tests.csproj --configuration Release --no-restore \
            --filter "FullyQualifiedName~Opt_in_disposable_sql_rehearsal_imports_and_recovers_40000_synthetic_students" \
            --logger "trx;LogFileName=student-import-40k.trx" --results-directory TestResults --logger "console;verbosity=detailed"

      - name: Preserve opt-in 40K import rehearsal evidence
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/Ashraful' && inputs.run_40k) || (github.event_name == 'push' && github.ref == 'refs/heads/Ashraful' && contains(github.event.head_commit.message, '[student-import-40k]'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: student-import-40k-${{ github.sha }}
          path: TestResults/student-import-40k.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated SQL Server
        if: always()
        run: docker rm -f eduos-ci-sqlserver >/dev/null 2>&1 || true
