name: Feature Discovery Chromium UI Acceptance
on:
  push:
    branches: [Ashraful]
    paths:
      - 'EduOS.App/wwwroot/js/platform/feature-discovery.js'
      - 'EduOS.App/wwwroot/js/sidebar-navigation.js'
      - 'EduOS.App/Views/Shared/_Layout.cshtml'
      - 'tests/browser/feature-discovery.cjs'
      - '.github/workflows/feature-discovery-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feature-discovery-browser-Ashraful
  cancel-in-progress: true
jobs:
  chromium-feature-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise bilingual feature discovery and session isolation in Chromium
        run: node tests/browser/feature-discovery.cjs
